name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # lfs: true downloads the real images (Pages' branch mode would serve LFS pointer files)
      - uses: actions/checkout@v4
        with:
          lfs: true

      # publish only the site itself, not the Python tooling
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html cameras.json _site/
          cp -r assets _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
